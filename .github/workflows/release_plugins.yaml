name: Release Audio Plugins

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-package-macos:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Download Prebuilt LibTorch (Universal / macOS)
        if: env.TORCH_UB_PATH != ''
        env:
          TORCH_UB_PATH: ${{ secrets.TORCH_UB_PATH }}
        run: |
          curl -L "${{ secrets.TORCH_UB_PATH }}" -o torch_ub.zip
          mkdir -p torch
          unzip -q torch_ub.zip -d torch
          mv torch/torch torch/libtorch || true

      - name: Import Apple Certificates & Keychain Setup
        if: env.CERT != ''
        env:
          CERT: ${{ secrets.CERT }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "${{ secrets.CERT }}" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "${{ secrets.CERT_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Store Notary Credentials in CI Keychain
        if: env.NOTARIZATION_USERNAME != '' && env.NOTARIZATION_PASSWORD != ''
        env:
          NOTARIZATION_USERNAME: ${{ secrets.NOTARIZATION_USERNAME }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcrun notarytool store-credentials "nnbend-notary" \
            --apple-id "${{ secrets.NOTARIZATION_USERNAME }}" \
            --team-id "${{ secrets.TEAM_ID }}" \
            --password "${{ secrets.NOTARIZATION_PASSWORD }}"

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake ../src \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_MAXMSP=OFF \
            -DBUILD_PUREDATA=OFF \
            -DBUILD_JUCE_PLUGIN=ON

      - name: Build Plugins & Standalone Target
        run: |
          cd build
          cmake --build . --target plugin --config Release
          cmake --build . --target standalone --config Release

      - name: Package macOS Installer (.pkg)
        env:
          SIGN_ID: ${{ secrets.SIGN_ID }}
          INSTALLER_SIGN_ID: ${{ secrets.INSTALLER_SIGN_ID }}
          NOTARIZATION_USERNAME: ${{ secrets.NOTARIZATION_USERNAME }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          bash install/package_macos.sh

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: macos-audio-plugins-installer
          path: dist/*.pkg

      - name: Attach Installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-package-windows:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download LibTorch (CPU Windows)
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-2.5.1%2Bcpu.zip" -OutFile "libtorch.zip"
          Expand-Archive -Path "libtorch.zip" -DestinationPath "."
          Remove-Item "libtorch.zip"

      - name: Configure CMake
        shell: powershell
        run: |
          cmake -S src -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$((Get-Item .).FullName)\libtorch" `
            -DBUILD_MAXMSP=OFF `
            -DBUILD_PUREDATA=OFF `
            -DBUILD_JUCE_PLUGIN=ON

      - name: Build Plugins & Standalone Target
        run: |
          cmake --build build --config Release --target plugin
          cmake --build build --config Release --target standalone

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Package Windows Release (Installer & ZIP)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File install/package_windows.ps1 -Config Release

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4.6.1
        with:
          name: windows-audio-plugins
          path: |
            dist/*.exe
            dist/*.zip

      - name: Attach Windows Release to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

